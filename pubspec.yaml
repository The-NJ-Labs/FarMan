name: FarMan
description: "Cross-platform Flutter app for registering and tracking livestock records offline."
publish_to: 'none'
version: 1.2.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  file_picker: ^8.0.5
  file_saver: ^0.2.12
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.0
  sqflite_common_ffi: ^2.4.5
  nowa_runtime: ^0.2.0
  google_sign_in: ^7.2.0
  animations: ^2.0.11
  page_navigation_transition: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icon sets live in flutter_launcher_icons.yaml (Light.png) and
# flutter_launcher_icons_dark.yaml (Dark.png). See scripts/icons.ps1.

flutter:
  assets:
    - assets/
    - assets/icon/
  fonts:
    - family: ABeeZee
      fonts:
        - asset: assets/fonts/ABeeZee.ttf
    - family: Abel
      fonts:
        - asset: assets/fonts/Abel.ttf
    - family: Abhaya Libre
      fonts:
        - asset: assets/fonts/Abhaya Libre.ttf
    - family: Acme
      fonts:
        - asset: assets/fonts/Acme.ttf
    - family: Allerta
      fonts:
        - asset: assets/fonts/Allerta.ttf
    - family: Alice
      fonts:
        - asset: assets/fonts/Alice.ttf
    - family: AR One Sans
      fonts:
        - asset: assets/fonts/AR One Sans.ttf
  uses-material-design: true